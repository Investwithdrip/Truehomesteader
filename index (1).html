5,days:90,cost:5000,yield:50000,skill:12},\n];\n\nfunction mkLvls(base){return Array.from({length:50},(_,i)=>{const m=Math.pow(1.45,i);const tier=Math.floor(i/10);const tN=["","Elite ","Master ","Legend ","Mythic "];return{lvl:i+1,cost:Math.round(base.baseCost*m),playerLvl:base.unlockLvl+i*2,harvestsNeeded:i===0?0:Math.round(5*Math.pow(1.8,Math.min(i,20))),cashEarned:i===0?0:Math.round(base.baseCost*m*0.8),income:Math.round(base.baseIncome*(1+i*0.6)),yieldBoost:base.baseYield>1?Math.min(4.0,base.baseYield+i*0.06):1,visual:(tN[tier]||"Mythic ")+base.emoji+(i>=40?"👑":i>=30?"🌟":i>=20?"🏆":i>=10?"⭐":""),desc:(tN[tier]||"Mythic ")+base.descs[Math.min(i%10,base.descs.length-1)]+" Lv."+(i+1)};});}\nfunction canUpgrade(id,sLvls,pLvl,hv,ea){const s=STRUCTS.find(x=>x.id===id);if(!s)return{ok:false,reason:"Not found"};const cur=sLvls[id]||0;if(cur>=50)return{ok:false,reason:"Max Lv.50!"};const u=mkLvls(s)[cur];if(pLvl<u.playerLvl)return{ok:false,reason:"Need Player Lv."+u.playerLvl};if(hv<u.harvestsNeeded)return{ok:false,reason:"Need "+u.harvestsNeeded+" harvests"};if(ea<u.cashEarned)return{ok:false,reason:"Need $"+Math.round(u.cashEarned/1000)+"k earned"};return{ok:true,cost:u.cost};}\nconst STRUCTS=[\n  {id:"compost",name:"Compost System",emoji:"🪱",category:"Farm",unlockLvl:1,baseCost:300,baseIncome:50,baseYield:1.2,visuals:["🪱","🪱🪱","🪱🪱🪱","🪱⭐","🪱🌱","🪱💰","🪱👑","🪱🌟","🪱🏆","🪱🌟🏆"],descs:["1 bin","2 bins","3 bins","4 bins","Vermicompost","Sell compost","Commercial","Regional","Export","Legendary"]},\n  {id:"coop",name:"Chicken Coop",emoji:"🐔",category:"Livestock",unlockLvl:2,baseCost:1000,baseIncome:200,baseYield:1.05,visuals:["🐔","🐔🐔","🐔🐔🐔","🥚🐔","🥚🥚","🐔🐣","🐔🏆","🐔⭐","🐔👑","🐔🌟"],descs:["4 hens","8 hens","12 hens","20 hens","40 hens","Broiler","Full poultry","Regional","State","Legendary"]},\n  {id:"greenhouse",name:"Greenhouse",emoji:"🏗️",category:"Farm",unlockLvl:4,baseCost:5000,baseIncome:500,baseYield:1.15,visuals:["🏗️","🏗️🌿","🏗️🌺","🏗️🌺🌺","🏗️⭐","🏗️💡","🏗️💧","🏗️🏆","🏗️👑","🏗️🌟"],descs  of odds){r-=m.w;if(r<=0)return m;}return MINERAL_TYPES[0];};\nexport default function TrueHomesteader(){\n  // Core game state\n  const [setup,setSetup]=useState(true);\n  const [step,setStep]=useState(1);\n  const [pName,setPName]=useState("");\n  const [pCity,setPCity]=useState("");\n  const [photoUrl,setPhotoUrl]=useState(null);\n  const [cash,setCash]=useState(5000);\n  const [income,setIncome]=useState(0);\n  const [xp,setXp]=useState(0);\n  const [level,setLevel]=useState(1);\n  const [days,setDays]=useState(1);\n  const [crops,setCrops]=useState([]);\n  const [structs,setStructs]=useState([]);\n  const [sLvls,setSLvls]=useState({});\n  const [buildingId,setBuildingId]=useState(null);\n  const [buildCat,setBuildCat]=useState("All");\n  const [shopCat,setShopCat]=useState("Seeds");\n  const [bizTab,setBizTab]=useState("buyers");\n  const [reputation,setReputation]=useState(0);\n  const [bizLevel,setBizLevel]=useState(0);\n  const [bizName,setBizName]=useState("");\n  const [bizCustomers,setBizCustomers]=useState(0);\n  const [totalSold,setTotalSold]=useState(0);\n  const [activePacks,setActivePacks]=useState([]);\n  const [showPurchase,setShowPurchase]=useState(null);\n  const [ownedSupplies,setOwnedSupplies]=useState({});\n  const [now,setNow]=useState(Date.now());\n  const [lastFlip,setLastFlip]=useState("");\n  const [spinning,setSpinning]=useState(false);\n  const [spinAngle,setSpinAngle]=useState(0);\n  const [flipResult,setFlipResult]=useState(null);\n  const [rareInv,setRareInv]=useState([]);\n  const [claimed,setClaimed]=useState([]);\n  const [pondLvl,setPondLvl]=useState(0);\n  const [fish,setFish]=useState([]);\n  const [animals,setAnimals]=useState([]);\n  const [craftInv,setCraftInv]=useState({});\n  const [npcRel,setNpcRel]=useState({});\n  const [decorations,setDecorations]=useState([]);\n  const [tourists,setTourists]=useState(0);\n  const [prestigeLvl,setPrestigeLvl]=useState(0);\n  const [tutStep,setTutStep]=useState(-1);\n  const [muted,setM
